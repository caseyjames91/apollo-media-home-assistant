name: Validate Apollo
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  hacs-card:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
  kodi-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s kodi/plugin.video.apollomedia/tests -p 'test_*.py' -q
      - run: python -m compileall -q kodi/plugin.video.apollomedia
  card-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/apollo-media-card.js
