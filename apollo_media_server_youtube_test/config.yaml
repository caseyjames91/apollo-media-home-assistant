name: Apollo Media Server YouTube Test
version: "0.2.17-youtube-test"
slug: apollo_media_server_youtube_test
description: Apollo-owned profiles, media state, local availability, progress, and playback sessions.
url: https://github.com/caseyjames91/apollo-media-home-assistant
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:television-play
panel_title: Apollo Media
homeassistant_api: true
hassio_api: true
map:
  - addon_config:rw
  - ssl:ro
options:
  log_level: info
  youtube_import_key: ""
schema:
  log_level: list(debug|info|warning|error)
  youtube_import_key: str
ports:
  8099/tcp: 18100
ports_description:
  8099/tcp: Apollo API (optional direct access)
